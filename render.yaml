services:
  - type: web
    name: usabilityhub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi db upgrade && gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: usabilityhub-db
          property: connectionString
      - key: FLASK_ENV
        value: production
databases:
  - name: usabilityhub-db
    databaseName: usabilityhub
    user: usabilityhub
